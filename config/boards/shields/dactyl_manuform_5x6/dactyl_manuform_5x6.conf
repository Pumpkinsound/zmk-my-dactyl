# Battery monitoring
CONFIG_BATTERY=y
CONFIG_BATTERY_NRF_VDDH=y
CONFIG_BATTERY_REPORT_INTERVAL=60000
CONFIG_ZMK_BATTERY_REPORTING=y

# Power management (idle sleep after 1 hour)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000  # 1 hour = 60 * 60 * 1000 ms

# Bluetooth stability and performance
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# USB and general
CONFIG_USB_DEVICE_PRODUCT="Dactyl 5x6"
