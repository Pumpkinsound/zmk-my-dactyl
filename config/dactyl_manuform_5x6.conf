#POWER MANAGEMENT FIX
# This disables deep sleep to keep BLE connection alive
CONFIG_ZMK_SLEEP=n
CONFIG_PM_DEVICE=n

# Increase wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
